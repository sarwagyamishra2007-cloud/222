<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- K figure: body lines -->
  <g stroke="#4f8ef7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- spine / torso -->
    <line x1="18" y1="10" x2="18" y2="38"/>
    <!-- shoulders -->
    <line x1="18" y1="16" x2="30" y2="12"/>
    <!-- hips -->
    <line x1="18" y1="28" x2="30" y2="32"/>
    <!-- upper arm right -->
    <line x1="30" y1="12" x2="36" y2="20"/>
    <!-- forearm right -->
    <line x1="36" y1="20" x2="34" y2="10"/>
    <!-- upper leg right -->
    <line x1="30" y1="32" x2="36" y2="40"/>
    <!-- lower leg right -->
    <line x1="36" y1="40" x2="34" y2="46"/>
  </g>
  <!-- Head dot -->
  <circle cx="18" cy="7" r="3.5" fill="#4f8ef7"/>
  <!-- Left arm faint -->
  <line x1="18" y1="16" x2="10" y2="22" stroke="#7c5cd8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leg faint -->
  <line x1="18" y1="28" x2="12" y2="36" stroke="#7c5cd8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arc pulse ring around figure -->
  <circle cx="18" cy="26" r="16" stroke="url(#lg)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- KINETRA wordmark -->
  <text x="50" y="33" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="800"
        font-size="22" letter-spacing="-0.5" fill="url(#lg)">KINETRA</text>
  <text x="50" y="45" font-family="-apple-system,'Segoe UI',system-ui,sans-serif" font-weight="400"
        font-size="9" letter-spacing="3.5" fill="#7c5cd8" opacity="0.85">AI POSTURE COACH</text>

  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#7c5cd8"/>
    </linearGradient>
  </defs>
</svg>
